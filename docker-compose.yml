      - ./.env
    environment:
      HOST: 0.0.0.0
      PORT: 8090
      DATABASE_URL: postgres://${POSTGRES_USER:-madrasti}:${POSTGRES_PASSWORD:-madrasti}@postgres:5432/${POSTGRES_DB:-madrasti}
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth:8081
      AUTH_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      SECURITY_SERVICE_URL: http://security:${SECURITY_PORT:-8091}
      SERVICE_NAME: document
      APP_VERSION: ${APP_VERSION:-dev}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    depends_on:
      auth:
        condition: service_healthy
      security:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - ${DOCUMENT_PORT:-8090}:8090
    command: ["npm", "run", "dev"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kong:
    image: kong:3.7
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_LOG_LEVEL: info
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_NGINX_HTTP_KEEPALIVE_TIMEOUT: "0s"
      KONG_NGINX_HTTP_KEEPALIVE_REQUESTS: "0"
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./infra/kong/kong.yml:/kong/declarative/kong.yml:ro
    depends_on:
      auth:
        condition: service_healthy
      student:
        condition: service_healthy
      school:
        condition: service_healthy
      user-profile:
        condition: service_healthy
      academic:
        condition: service_healthy
      attendance:
        condition: service_healthy
      scheduling:
        condition: service_healthy
      reporting:
        condition: service_healthy
      notification:
        condition: service_healthy
      document:
        condition: service_healthy
      security:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  redisdata:
