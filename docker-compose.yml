services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-madrasti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-madrasti}
      POSTGRES_DB: ${POSTGRES_DB:-madrasti}
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./services/auth/migrations:/migrations/auth:ro
      - ./services/student/migrations:/migrations/student:ro
      - ./services/school/migrations:/migrations/school:ro
      - ./services/user-profile/migrations:/migrations/user-profile:ro
      - ./services/security/migrations:/migrations/security:ro
      - ./services/academic/migrations:/migrations/academic:ro
      - ./services/attendance/migrations:/migrations/attendance:ro
      - ./services/scheduling/migrations:/migrations/scheduling:ro
      - ./services/reporting/migrations:/migrations/reporting:ro
      - ./services/notification/migrations:/migrations/notification:ro
      - ./services/document/migrations:/migrations/document:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-madrasti} -d ${POSTGRES_DB:-madrasti}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - ${REDIS_PORT:-6379}:6379
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    env_file:
      - ./.env
    environment:
      HOST: 0.0.0.0
      PORT: 8081
      DATABASE_URL: postgres://${POSTGRES_USER:-madrasti}:${POSTGRES_PASSWORD:-madrasti}@postgres:5432/${POSTGRES_DB:-madrasti}
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth:8081
      AUTH_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      SECURITY_SERVICE_URL: http://security:${SECURITY_PORT:-8091}
      SECURITY_SERVICE_TOKEN: ${SECURITY_SERVICE_TOKEN:-change-me-in-prod}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - ${AUTH_PORT:-8081}:8081
    command: ["npm", "run", "dev"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  security:
    build:
      context: .
      dockerfile: services/security/Dockerfile
    env_file:
      - ./.env
    environment:
      HOST: 0.0.0.0
      PORT: ${SECURITY_PORT:-8091}
      DATABASE_URL: postgres://${POSTGRES_USER:-madrasti}:${POSTGRES_PASSWORD:-madrasti}@postgres:5432/${POSTGRES_DB:-madrasti}
      REDIS_URL: redis://redis:6379
      SECURITY_SERVICE_TOKEN: ${SECURITY_SERVICE_TOKEN:-change-me-in-prod}
      SERVICE_NAME: security
      APP_VERSION: ${APP_VERSION:-dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${SECURITY_PORT:-8091}:${SECURITY_PORT:-8091}"
    command: ["npm", "run", "dev"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  student:
    build:
      context: .
      dockerfile: services/student/Dockerfile
    env_file:
      - ./.env
    environment:
      HOST: 0.0.0.0
      PORT: 8082
      DATABASE_URL: postgres://${POSTGRES_USER:-madrasti}:${POSTGRES_PASSWORD:-madrasti}@postgres:5432/${POSTGRES_DB:-madrasti}
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth:8081
      AUTH_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      SECURITY_SERVICE_URL: http://security:${SECURITY_PORT:-8091}
      SECURITY_SERVICE_TOKEN: ${SECURITY_SERVICE_TOKEN:-change-me-in-prod}
      TEST_BYPASS_AUTH: "0"
    depends_on:
      auth:
        condition: service_healthy
