_format_version: "3.0"

# ── Global plugins ────────────────────────────────────────────────────────────
plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
      methods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
      headers: ["Accept","Authorization","Content-Type","X-School-ID","X-Request-ID"]
      exposed_headers: ["X-Request-ID"]
      credentials: true
      max_age: 3600
      preflight_continue: false

  # Global rate limit — protects all upstream services from floods.
  # local policy is per Kong node; switch to redis policy in multi-node prod.
  - name: rate-limiting
    config:
      minute: 600
      policy: local
      limit_by: ip
      fault_tolerant: true
      hide_client_headers: false

# ── Services ──────────────────────────────────────────────────────────────────
services:
  - name: auth
    url: http://auth:8081
    # Stricter limit on auth routes — prevents credential stuffing / brute-force.
    plugins:
      - name: rate-limiting
        config:
          minute: 20
          policy: local
          limit_by: ip
          fault_tolerant: true
    routes:
      - name: auth-route
        paths: ["/auth"]
        strip_path: true
        methods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]

  - name: student
