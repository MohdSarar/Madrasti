_format_version: "3.0"

services:
  - name: auth
    url: http://auth:8081
    routes:
      - name: auth-route
        paths: ["/auth"]
        strip_path: true
        methods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
    plugins:
      - name: cors
        config:
          origins: ["http://localhost:3000"]
          methods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
          headers: ["Accept","Authorization","Content-Type"]
          credentials: true
          max_age: 3600

