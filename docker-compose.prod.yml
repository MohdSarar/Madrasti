services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Connection pooler ────────────────────────────────────────────────────────
  pgbouncer:
    image: pgbouncer/pgbouncer
    restart: unless-stopped
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: "5432"
      DATABASES_USER: ${POSTGRES_USER}
      DATABASES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASES_DBNAME: ${POSTGRES_DB}
      PGBOUNCER_LISTEN_PORT: "5432"
      PGBOUNCER_AUTH_TYPE: any
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "1000"
      PGBOUNCER_DEFAULT_POOL_SIZE: "25"
      PGBOUNCER_MIN_POOL_SIZE: "5"
      QUIET: "1"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 1 localhost 5432"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 64M

  # ── Migrations ───────────────────────────────────────────────────────────────
  db-migrator:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./infra/db-migrate/migrate.sh:/migrate.sh:ro
      - ./services/auth/migrations:/migrations/auth:ro
      - ./services/student/migrations:/migrations/student:ro
      - ./services/school/migrations:/migrations/school:ro
      - ./services/user-profile/migrations:/migrations/user-profile:ro
      - ./services/security/migrations:/migrations/security:ro
      - ./services/academic/migrations:/migrations/academic:ro
      - ./services/attendance/migrations:/migrations/attendance:ro
      - ./services/scheduling/migrations:/migrations/scheduling:ro
      - ./services/reporting/migrations:/migrations/reporting:ro
      - ./services/notification/migrations:/migrations/notification:ro
      - ./services/document/migrations:/migrations/document:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bash", "/migrate.sh"]

  # ── Core services ────────────────────────────────────────────────────────────
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8081
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AUTH_SERVICE_URL: http://auth:8081
      AUTH_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      SECURITY_SERVICE_URL: http://security:8091
      SECURITY_SERVICE_TOKEN: ${SECURITY_SERVICE_TOKEN}
      TRUST_PROXY: "1"
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["npm", "run", "start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

  security:
    build:
      context: .
      dockerfile: services/security/Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8091
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SECURITY_SERVICE_TOKEN: ${SECURITY_SERVICE_TOKEN}
      SERVICE_NAME: security
      APP_VERSION: ${APP_VERSION}
      TRUST_PROXY: "1"
