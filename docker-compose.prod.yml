services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./services/auth/migrations:/migrations/auth:ro
      - ./services/student/migrations:/migrations/student:ro
      - ./services/school/migrations:/migrations/school:ro
      - ./services/user-profile/migrations:/migrations/user-profile:ro
      - ./services/security/migrations:/migrations/security:ro
      - ./services/academic/migrations:/migrations/academic:ro
      - ./services/attendance/migrations:/migrations/attendance:ro
      - ./services/scheduling/migrations:/migrations/scheduling:ro
      - ./services/reporting/migrations:/migrations/reporting:ro
      - ./services/notification/migrations:/migrations/notification:ro
      - ./services/document/migrations:/migrations/document:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256M

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      HOST: 0.0.0.0
      PORT: 8081
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AUTH_SERVICE_URL: http://auth:8081
      AUTH_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      SECURITY_SERVICE_URL: http://security:8091
      SECURITY_SERVICE_TOKEN: ${SECURITY_SERVICE_TOKEN}
      TRUST_PROXY: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["npm", "run", "start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

  security:
    build:
      context: .
      dockerfile: services/security/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      HOST: 0.0.0.0
      PORT: 8091
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SECURITY_SERVICE_TOKEN: ${SECURITY_SERVICE_TOKEN}
      SERVICE_NAME: security
      APP_VERSION: ${APP_VERSION}
      TRUST_PROXY: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["npm", "run", "start"]
    healthcheck:
