          memory: 256M

  kong:
    image: kong:3.7
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_LOG_LEVEL: warn
      KONG_PROXY_ACCESS_LOG: /dev/null
      KONG_ADMIN_ACCESS_LOG: /dev/null
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
    ports:
      - "8000:8000"
    volumes:
      - ./infra/kong/kong.yml:/kong/declarative/kong.yml:ro
    depends_on:
      auth:
        condition: service_healthy
      student:
        condition: service_healthy
      school:
        condition: service_healthy
      user-profile:
        condition: service_healthy
      academic:
        condition: service_healthy
      attendance:
        condition: service_healthy
      scheduling:
        condition: service_healthy
      reporting:
        condition: service_healthy
      notification:
        condition: service_healthy
      document:
        condition: service_healthy
      security:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
  redisdata:
