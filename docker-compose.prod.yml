      SECURITY_SERVICE_URL: http://security:8091
      SECURITY_SERVICE_TOKEN: ${SECURITY_SERVICE_TOKEN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      TRUST_PROXY: "1"
    depends_on:
